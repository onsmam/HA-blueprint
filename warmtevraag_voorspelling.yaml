# Version: 1.2.0
# Warmtevraag-voorspelling (Home Assistant package)
#
# Simuleert uur voor uur hoe het huis afkoelt zonder verwarming en zonder zon,
# met de uurverwachting van de buitentemperatuur. Uitkomst: het aantal uren
# tot het huis onder de minimumtemperatuur zakt. Ligt dat binnen de horizon,
# dan is zonnewarmte die nu binnenkomt nuttig (buffer in vloer en muren) en
# staat binary_sensor.zonnewarmte_nuttig aan. Die kan de warmtemodus van de
# blueprint 'Zonwering multi-gevel' aansturen.
#
# Daarnaast: sensor.warmteverlies_actueel (kW die het huis nu verliest) en
# sensor.warmtevraag_actueel (dat verlies min interne warmte en gemeten
# zonnewinst: wat de warmtepomp nu moet leveren).
#
# Twee automations geven de verwarming van de warmtepomp eenmaal per seizoen
# vrij of zetten hem uit (zie onderaan).
#
# Installatie: zet dit bestand in config/packages/ (bestandsnaam met underscore,
# het wordt de package-naam) met in configuration.yaml
#   homeassistant:
#     packages: !include_dir_named packages
# of kopieer het template:-blok naar configuration.yaml.
#
# Huismodel (afgeleid uit afkoelnachten met de warmtepomp uit):
#   H     warmteverlies in kW per graad verschil binnen-buiten
#   P_INT interne warmte (apparaten, mensen) in kW
#   C     warmtecapaciteit van het huis in kWh per graad
#   T_MIN onder deze gemiddelde binnentemperatuur is verwarming nodig
#   A_ZON effectief zonoppervlak in m2: zonnewinst in kW = A_ZON x gemeten
#         straling in kW/m2 x deel dat de screens open staan (uit de
#         winterfit: 3,43 kWh warmte per kWh/m2 instraling met open screens)
#   WTW_OFFSET  zijn alle kamerthermostaten onbeschikbaar, dan geldt de
#         binnentemperatuur van de WTW plus deze correctie (die meet gemiddeld
#         0,36 graad lager dan de kamers)
# Pas deze waarden en de entiteiten hieronder aan als het model beter bekend is.

template:
  - trigger:
      - trigger: time_pattern
        minutes: "/30"
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    action:
      - action: weather.get_forecasts
        target:
          entity_id: weather.rammenas
        data:
          type: hourly
        response_variable: fc
      - variables:
          wv: >
            {% set H = 0.17 %}
            {% set P_INT = 0.4 %}
            {% set C = 27 %}
            {% set T_MIN = 21 %}
            {% set WTW_OFFSET = 0.36 %}
            {% set rooms = [
                 'climate.woonkamer', 'climate.keuken', 'climate.hal',
                 'climate.badkamer', 'climate.masterbedroom', 'climate.sophie',
                 'climate.thijmen', 'climate.studeerkamer', 'climate.logeerkamer'] %}
            {% set temps = rooms | map('state_attr', 'current_temperature')
                 | reject('none') | map('float') | list %}
            {% set fl = fc['weather.rammenas'].forecast
                 | selectattr('temperature', 'defined') | list %}
            {% set wtw = states('sensor.fan_modbus_actuele_temperatuur_woning') %}
            {% set t_in = temps | sum / temps | count if temps | count > 0
                 else (wtw | float + WTW_OFFSET if is_number(wtw) else none) %}
            {% set bron = 'kamers' if temps | count > 0 else 'WTW' %}
            {% if t_in is none or fl | count == 0 %}
              {{ {'ok': false} }}
            {% else %}
              {% set ns = namespace(t=t_in, uren=none, t24=t_in, buiten24=0) %}
              {% for f in fl %}
                {% set ns.t = ns.t - (H * (ns.t - f.temperature | float) - P_INT) / C %}
                {% if ns.uren is none and ns.t < T_MIN %}
                  {% set ns.uren = loop.index %}
                {% endif %}
                {% if loop.index <= 24 %}
                  {% set ns.buiten24 = ns.buiten24 + f.temperature | float %}
                  {% set ns.t24 = ns.t %}
                {% endif %}
              {% endfor %}
              {% set buiten24 = ns.buiten24 / ([fl | count, 24] | min) %}
              {{ {
                   'ok': true,
                   'uren': ns.uren if ns.uren is not none else fl | count,
                   'bereikt': ns.uren is not none,
                   'binnen_nu': t_in | round(1),
                   'binnenbron': bron,
                   'binnen_over_24u': ns.t24 | round(1),
                   'buiten_gem_24u': buiten24 | round(1),
                   'warmtevraag_24u_kwh': ([(H * (T_MIN - buiten24) - P_INT) * 24, 0] | max) | round(1),
                   'buffer_kwh': (C * (t_in - T_MIN)) | round(1),
                   'verwachting_uren': fl | count
                 } }}
            {% endif %}
    sensor:
      - name: Uren tot warmtevraag
        unique_id: uren_tot_warmtevraag
        unit_of_measurement: h
        icon: mdi:home-thermometer-outline
        availability: "{{ wv.ok }}"
        state: "{{ wv.uren }}"
        attributes:
          bereikt_binnen_verwachting: "{{ wv.bereikt }}"
          binnentemperatuur_nu: "{{ wv.binnen_nu }}"
          binnentemperatuur_bron: "{{ wv.binnenbron }}"
          binnentemperatuur_over_24u: "{{ wv.binnen_over_24u }}"
          buitentemperatuur_gem_24u: "{{ wv.buiten_gem_24u }}"
          warmtevraag_24u_kwh: "{{ wv.warmtevraag_24u_kwh }}"
          buffer_boven_minimum_kwh: "{{ wv.buffer_kwh }}"
          lengte_verwachting_uren: "{{ wv.verwachting_uren }}"

  - binary_sensor:
      # Aan als het huis zonder verwarming binnen HORIZON uur onder de
      # minimumtemperatuur zakt. Pas uit bij 6 uur boven de horizon, zodat een
      # kleine wijziging in de verwachting de screens niet laat pendelen.
      - name: Zonnewarmte nuttig
        unique_id: zonnewarmte_nuttig
        icon: mdi:sun-thermometer-outline
        availability: "{{ is_number(states('sensor.uren_tot_warmtevraag')) }}"
        state: >
          {% set HORIZON = 48 %}
          {% set h = states('sensor.uren_tot_warmtevraag') | float(999) %}
          {{ h <= (HORIZON + 6 if this.state == 'on' else HORIZON) }}
        attributes:
          uren_tot_warmtevraag: "{{ states('sensor.uren_tot_warmtevraag') }}"

  # Actueel warmteverlies en warmtevraag met hetzelfde huismodel (houd H en
  # P_INT gelijk aan de voorspelling hierboven).
  - trigger:
      - trigger: state
        entity_id:
          - sensor.fan_modbus_actuele_temperatuur_buitensensor
          - sensor.fan_modbus_actuele_temperatuur_woning
          - sensor.st_00125314_straling
          - cover.screens
      - trigger: state
        entity_id: &kamers
          - climate.woonkamer
          - climate.keuken
          - climate.hal
          - climate.badkamer
          - climate.masterbedroom
          - climate.sophie
          - climate.thijmen
          - climate.studeerkamer
          - climate.logeerkamer
        attribute: current_temperature
      - trigger: homeassistant
        event: start
      - trigger: event
        event_type: event_template_reloaded
    action:
      - variables:
          kamers: *kamers
          wa: >
            {% set H = 0.17 %}
            {% set P_INT = 0.4 %}
            {% set A_ZON = 3.43 %}
            {% set WTW_OFFSET = 0.36 %}
            {% set temps = kamers | map('state_attr', 'current_temperature')
                 | reject('none') | map('float') | list %}
            {% set t_out = states('sensor.fan_modbus_actuele_temperatuur_buitensensor') %}
            {% set wtw = states('sensor.fan_modbus_actuele_temperatuur_woning') %}
            {% set t_in = temps | sum / temps | count if temps | count > 0
                 else (wtw | float + WTW_OFFSET if is_number(wtw) else none) %}
            {% set bron = 'kamers' if temps | count > 0 else 'WTW' %}
            {% if t_in is none or not is_number(t_out) %}
              {{ {'ok': false} }}
            {% else %}
              {% set verlies = H * (t_in - t_out | float) %}
              {# Dichte screens: geen zonnewinst; onbekende stand telt als open. #}
              {% set pos = state_attr('cover.screens', 'current_position') %}
              {% set open = pos | float / 100 if is_number(pos) else 1 %}
              {% set zon = A_ZON * (states('sensor.st_00125314_straling') | float(0)) / 1000 * open %}
              {{ {
                   'ok': true,
                   'verlies': verlies | round(2),
                   'zon': zon | round(2),
                   'screens_open': (open * 100) | round(0) | int,
                   'vraag': ([verlies - P_INT - zon, 0] | max) | round(2),
                   'binnen': t_in | round(1),
                   'binnenbron': bron,
                   'buiten': t_out | float | round(1)
                 } }}
            {% endif %}
    sensor:
      - name: Warmteverlies actueel
        unique_id: warmteverlies_actueel
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:home-export-outline
        availability: "{{ wa.ok }}"
        state: "{{ wa.verlies }}"
        attributes:
          binnentemperatuur: "{{ wa.binnen }}"
          binnentemperatuur_bron: "{{ wa.binnenbron }}"
          buitentemperatuur: "{{ wa.buiten }}"
      # Wat de warmtepomp nu moet leveren om de binnentemperatuur te houden:
      # verlies min interne warmte en zonnewinst, nooit negatief.
      - name: Warmtevraag actueel
        unique_id: warmtevraag_actueel
        unit_of_measurement: kW
        device_class: power
        state_class: measurement
        icon: mdi:heat-pump-outline
        availability: "{{ wa.ok }}"
        state: "{{ wa.vraag }}"
        attributes:
          zonnewinst_kw: "{{ wa.zon }}"
          screens_open_procent: "{{ wa.screens_open }}"
          interne_warmte_kw: 0.4

# Stookseizoen: de verwarming eenmaal per seizoen vrijgeven en weer uitzetten.
# Vrijgeven (september t/m februari): het huis zakt volgens de voorspelling
# binnen 12 uur onder T_MIN, of is (bij een onbeschikbare voorspelling) al 3 uur
# onder T_MIN gebleven.
# Uitzetten (maart t/m juni): zowel de afgelopen 24 uur als de verwachting voor
# de komende 24 uur gemiddeld boven de stookgrens. Buiten die maanden wordt er
# niet automatisch geschakeld, dus een koude week in mei zet de verwarming niet
# opnieuw aan (en een warme dag in oktober niet uit).
automation:
  - id: warmtepomp_stookseizoen_aan
    alias: "Warmtepomp: stookseizoen aan"
    description: >
      Geeft de verwarming in september t/m februari vrij zodra het huis volgens
      de voorspelling binnen 12 uur onder de 21 graden zakt, of al 3 uur onder
      de 21 graden is.
    mode: single
    triggers:
      - trigger: numeric_state
        entity_id: sensor.uren_tot_warmtevraag
        below: 12.5
      - trigger: template
        value_template: "{{ state_attr('sensor.warmteverlies_actueel', 'binnentemperatuur') | float(99) < 21 }}"
        for: "03:00:00"
      # Een herstart breekt de 3 uur af; daarna alleen nog controleren.
      - trigger: homeassistant
        event: start
    conditions:
      - condition: template
        alias: "September t/m februari"
        value_template: "{{ now().month in [9, 10, 11, 12, 1, 2] }}"
      - condition: state
        alias: "Verwarming staat nog uit"
        entity_id: switch.luxtronik_281211_0164_heating
        state: "off"
      - condition: or
        alias: "Warmte binnen 12 uur nodig of binnen al onder 21 graden"
        conditions:
          - condition: numeric_state
            alias: "Voorspelling: binnen 12 uur onder 21 graden"
            entity_id: sensor.uren_tot_warmtevraag
            below: 12.5
          - condition: template
            alias: "Binnen onder 21 graden"
            value_template: "{{ state_attr('sensor.warmteverlies_actueel', 'binnentemperatuur') | float(99) < 21 }}"
    actions:
      - action: switch.turn_on
        target:
          entity_id: switch.luxtronik_281211_0164_heating
      - action: persistent_notification.create
        data:
          title: Stookseizoen gestart
          message: >
            Verwarming van de warmtepomp vrijgegeven: binnen
            {{ state_attr('sensor.warmteverlies_actueel', 'binnentemperatuur') }} graden,
            volgens de voorspelling over {{ states('sensor.uren_tot_warmtevraag') }} uur
            onder de 21 graden.

  - id: warmtepomp_stookseizoen_uit
    alias: "Warmtepomp: stookseizoen uit"
    description: >
      Zet de verwarming uit als in maart t/m juni het 24-uursgemiddelde buiten
      en de verwachting voor de komende 24 uur boven de stookgrens liggen.
    mode: single
    triggers:
      - trigger: time
        at: "10:00:00"
    conditions:
      - condition: template
        alias: "Maart t/m juni"
        value_template: "{{ now().month in [3, 4, 5, 6] }}"
      - condition: state
        alias: "Verwarming staat nog aan"
        entity_id: switch.luxtronik_281211_0164_heating
        state: "on"
      - condition: numeric_state
        alias: "Afgelopen 24 uur gemiddeld boven de stookgrens"
        entity_id: sensor.luxtronik_281211_0164_outdoor_temperature_average
        above: 15
      - condition: template
        alias: "Komende 24 uur gemiddeld boven de stookgrens"
        value_template: "{{ state_attr('sensor.uren_tot_warmtevraag', 'buitentemperatuur_gem_24u') | float(-99) > 15 }}"
    actions:
      - action: switch.turn_off
        target:
          entity_id: switch.luxtronik_281211_0164_heating
      - action: persistent_notification.create
        data:
          title: Stookseizoen beëindigd
          message: >
            Verwarming van de warmtepomp uitgezet: buiten gemiddeld
            {{ states('sensor.luxtronik_281211_0164_outdoor_temperature_average') }} graden,
            verwachting komende 24 uur
            {{ state_attr('sensor.uren_tot_warmtevraag', 'buitentemperatuur_gem_24u') }} graden.
